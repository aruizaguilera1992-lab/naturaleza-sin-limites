name: Stabilization checks
on:
  pull_request:
    branches: [main, fix/stabilization-capacity-sandbox, fix/sprint-b-security, test/sprint-c-isolated-bookings]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Payment server type checks
        run: >-
          deno check --node-modules-dir=none
          supabase/functions/create-activity-deposit/index.ts
          supabase/functions/create-plan-checkout/index.ts
          supabase/functions/create-payment-link/index.ts
          supabase/functions/submit-request/index.ts
          supabase/functions/create-portal-session/index.ts
          supabase/functions/get-payment/index.ts
          supabase/functions/payments-webhook/index.ts
      - name: Server and database tests (simulated providers)
        run: >-
          deno test --node-modules-dir=none --allow-env --allow-read --allow-sys
          supabase/functions/create-activity-deposit/handler.test.ts
          supabase/functions/get-payment/eligibility.test.ts
          supabase/functions/get-payment/checkout.test.ts
          supabase/functions/_shared/email.test.ts
          supabase/functions/_shared/stripe.test.ts
          supabase/tests/capacity_max_six.test.ts
          supabase/tests/migration_history.test.ts
          supabase/tests/prepare_deposit_checkout.test.ts
          supabase/functions/create-payment-link/handler.test.ts
          supabase/functions/_shared/bookingEmail.test.ts
          supabase/functions/_shared/bookingEmailContext.test.ts
  dev-security-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:security
  local-schema-rebuild:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: nsl_local_admin
          POSTGRES_PASSWORD: nsl-ci-fixture-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nsl_local_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test scripts/local-db/target.test.mjs
      - name: Configure ephemeral local fixture only
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.mkdirSync('.tools/local-postgres', { recursive: true });
          fs.writeFileSync('.tools/local-postgres/credentials.local.json', JSON.stringify({
            host: '127.0.0.1', port: 55432, user: 'nsl_local_admin',
            password: 'nsl-ci-fixture-only'
          }));
          JS
      - name: Rebuild and verify native local schema
        run: node scripts/rebuild-local-db.mjs --database nsl_rebuild_ci
      - name: Refuse an existing fixture database
        run: node scripts/local-db/check-existing.mjs --database nsl_rebuild_ci
