name: Stabilization checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Matches the existing build workflow; package-lock is not yet aligned with package.json.
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Server and database tests (simulated providers)
        run: >-
          deno test --node-modules-dir=none --allow-env --allow-read --allow-sys
          supabase/functions/create-activity-deposit/handler.test.ts
          supabase/functions/get-payment/eligibility.test.ts
          supabase/functions/get-payment/checkout.test.ts
          supabase/functions/_shared/email.test.ts
          supabase/functions/_shared/stripe.test.ts
          supabase/tests/capacity_max_six.test.ts
