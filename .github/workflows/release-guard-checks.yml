name: Release guard checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/release-guard-checks.yml'
      - 'scripts/deployment-guard*'
      - 'docs/integration-readiness.md'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test scripts/deployment-guard.test.mjs
      - run: npm run build
